version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-report
    restart: always
    command:
      # Dashboard
      - "--api.dashboard=true"
      # Docker provider — only services with traefik.enable=true are exposed
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # File provider — watches /dynamic for TLS certs and route overrides (hot-reload)
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # --- Production only: swap local TLS for ACME ---
      # - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/certs:/certs:ro"
      - "./traefik/dynamic:/dynamic:ro"
      # Production: - "./letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true"
      # Dashboard router — https://traefik.localhost/dashboard/
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Shared HTTP→HTTPS redirect middleware
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    networks:
      - logging-network

  log-report:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: log_report
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    # No ports — internal only, reachable at http://log_report:8000 within logging-network
    labels:
      - "traefik.enable=false"
    networks:
      - logging-network

  log-report-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://log_report:8000
    container_name: log_report_client
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      - log-report
    labels:
      - "traefik.enable=true"
      # HTTPS router — uses local cert from dynamic file provider (tls=true, no certresolver)
      - "traefik.http.routers.client.rule=Host(`${CLIENT_DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls=true"
      # Production: swap tls=true for:
      # - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.services.client.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.client-http.rule=Host(`${CLIENT_DOMAIN}`)"
      - "traefik.http.routers.client-http.entrypoints=web"
      - "traefik.http.routers.client-http.middlewares=redirect-https@docker"
    networks:
      - logging-network

networks:
  logging-network:
    external: true
    driver: bridge
