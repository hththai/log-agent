version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik-report
    restart: always
    profiles: [traefik]
    command:
      - "--api.dashboard=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # File provider — hot-reloads TLS certs from /dynamic without restart
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/certs:/certs:ro"
      - "./traefik/dynamic:/dynamic:ro"
    labels:
      - "traefik.enable=true"
      # Dashboard — local only, served with mkcert cert
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Shared middleware — HTTP → HTTPS redirect
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
    networks:
      - logging-network

  log-report:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: log_report
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CLIENT_BASE_URL: https://${CLIENT_PUBLIC_DOMAIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      CORS_ORIGINS: '["https://${CLIENT_PUBLIC_DOMAIN}"]'
    # No ports — internal only, plain HTTP within logging-network
    labels:
      - "traefik.enable=false"
    networks:
      - logging-network

  log-report-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://log_report:8000
    container_name: log_report_client
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      log-report:
        condition: service_started
      traefik:
        condition: service_healthy
        required: false
    labels:
      - "traefik.enable=true"
      # Backend — plain HTTP; TLS terminates at Traefik (Cloudflare Full strict handles the rest)
      - "traefik.http.services.client.loadbalancer.server.port=3000"
      # HTTPS router — both domains share one router
      # Traefik picks the right cert by SNI: mkcert for .localhost, CF origin cert for .hthai.cloud
      - "traefik.http.routers.client.rule=Host(`${CLIENT_LOCAL_DOMAIN}`) || Host(`${CLIENT_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls=true"
      # HTTP → HTTPS for both domains
      - "traefik.http.routers.client-http.rule=Host(`${CLIENT_LOCAL_DOMAIN}`) || Host(`${CLIENT_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.client-http.entrypoints=web"
      - "traefik.http.routers.client-http.middlewares=redirect-https@docker"
    networks:
      - logging-network

networks:
  logging-network:
    external: true
    driver: bridge
