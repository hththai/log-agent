version: '3.8'

services:
  log-report:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: log_report
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    # or:
    # env_file:
    #   - ./server/.env
    ports:
      - "${SERVER_PORT:-8000}:8000"
    # Start log-agent's DB stack first: cd ../log-report && docker compose -f docker-compose.db.yml up -d
    networks:
      - logging-network
  log-report-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: log_report_client
    restart: always
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - log-report
    networks:
      - logging-network

networks:
  logging-network:
    external: true
    driver: bridge
